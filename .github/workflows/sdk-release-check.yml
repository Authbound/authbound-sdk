name: SDK Release Check

on:
  workflow_dispatch:
  push:
    tags:
      - "sdk-v*"

concurrency:
  group: sdk-release-check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-check:
    name: SDK release check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify release tag matches package versions
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        env:
          SDK_RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node --input-type=module - <<'NODE'
          import {
            PUBLISHABLE_PACKAGES,
            RELEASE_VERSION,
            assertSourceReleaseManifests,
            loadWorkspaceManifests,
          } from './scripts/release-set.mjs';

          const manifests = loadWorkspaceManifests();
          assertSourceReleaseManifests(manifests);
          const expectedVersion = process.env.SDK_RELEASE_VERSION?.replace(/^sdk-v/, '');
          if (expectedVersion !== RELEASE_VERSION) {
            throw new Error(
              `Release tag ${expectedVersion} does not match release set version ${RELEASE_VERSION}`
            );
          }

          for (const packageName of PUBLISHABLE_PACKAGES) {
            if (manifests[packageName].version !== expectedVersion) {
              throw new Error(`${packageName} does not match release tag ${expectedVersion}`);
            }
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release check
        run: pnpm release:check
