name: SDK Release Check

on:
  workflow_dispatch:
  push:
    tags:
      - "sdk-v*"

concurrency:
  group: sdk-release-check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-check:
    name: SDK release check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Verify release tag matches package versions
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        env:
          SDK_RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const expectedVersion = process.env.SDK_RELEASE_VERSION?.replace(/^sdk-v/, '');
          const packageDirs = ['core', 'server', 'react', 'vue', 'nextjs', 'nuxt'];
          const mismatches = [];

          for (const packageDir of packageDirs) {
            const manifestPath = path.join('packages', packageDir, 'package.json');
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            if (manifest.version !== expectedVersion) {
              mismatches.push(`${manifest.name}@${manifest.version}`);
            }
          }

          if (mismatches.length > 0) {
            throw new Error(
              `Expected all SDK packages to be ${expectedVersion}; mismatches: ${mismatches.join(', ')}`
            );
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release check
        run: pnpm release:check
